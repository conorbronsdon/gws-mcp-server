name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

# Serialize publishes: each step checks a target, then writes it; overlapping runs
# could both see "missing". Never cancel a run mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24 ships npm >=11.5.1 with sigstore intact; self-upgrading npm on the
          # Node 22 runner broke provenance publish ("Cannot find module sigstore").
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if package.json version is already published
        id: version
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          # Ask whether THIS version is on npm, not what the `latest` dist-tag points at.
          # If latest moves past a release that failed part-way, a latest-based check says
          # "changed" and npm publish hits E403 on every catch-up. Only a clear not-found
          # means unpublished; any other npm error stops here instead of guessing.
          ERR="$(mktemp)"
          if EXACT="$(npm view "$PKG_NAME@$LOCAL_VERSION" version 2>"$ERR")"; then
            if [ "$EXACT" = "$LOCAL_VERSION" ]; then
              FOUND=yes
            elif [ -z "$EXACT" ]; then
              # Older npm prints nothing (exit 0) for a missing version of an existing package.
              FOUND=no
            else
              echo "::error::npm view $PKG_NAME@$LOCAL_VERSION returned '$EXACT', expected '$LOCAL_VERSION' or nothing."
              exit 1
            fi
          elif grep -q 'code E404' "$ERR"; then
            FOUND=no
          else
            cat "$ERR" >&2
            echo "::error::Could not check whether $PKG_NAME@$LOCAL_VERSION is on npm (the error was not a 404). Not guessing; re-run once npm answers."
            exit 1
          fi
          # "published" is this exact version when npm has it, else "none".
          if [ "$FOUND" = yes ]; then
            echo "published=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$LOCAL_VERSION is already on npm — nothing to do."
          else
            echo "published=none" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$LOCAL_VERSION is not on npm — publishing."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test --if-present

      - name: Show tool versions
        if: steps.version.outputs.changed == 'true'
        run: node --version && npm --version

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance

      # npm can take a minute or more to serve a version it just accepted, and both
      # mcp-publisher (it checks the npm package version) and the GitHub release need
      # it. Wait (bounded) here, before either. Only when the version step found the
      # version unpublished: when changed is false that step already saw npm serve it,
      # and polling then could turn an npm outage into a failed no-op run.
      - name: Wait for npm to serve this version
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          PKG="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 10); do
            [ "$(npm view "$PKG@$VERSION" version 2>/dev/null)" = "$VERSION" ] && break
            [ "$attempt" = 10 ] && { echo "::error::$PKG@$VERSION is still not on npm after ~5 minutes; not publishing to the MCP registry or creating a GitHub release for an unpublished version. Once npm serves it, start Publish manually (workflow_dispatch): a plain re-run of this push skips the registry leg."; exit 1; }
            sleep 30
          done
          echo "npm serves $PKG@$VERSION."

      # Overwrites server.json in the runner's checkout so the version the
      # registry receives below always comes from package.json. The write is
      # never committed, so the server.json in git can still show a stale
      # version between releases — what this guarantees is the published
      # artifact, not the file on main. The registry stayed pinned at the
      # June 2026 versions because server.json was hand-maintained and nobody
      # re-published it; deriving it here is what fixes that.
      - name: Sync server.json version from package.json
        if: steps.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = pkg.version;
            for (const p of server.packages || []) p.version = pkg.version;
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + "\n");
          '
          node -p "\"server.json is now at \" + require('./server.json').version"

      # A package.json-only push with no version bump is a no-op. A manual
      # dispatch can still perform a registry-only catch-up when npm and the
      # registry are out of sync.
      - name: Check if version is already in the MCP registry
        if: steps.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: registry
        run: |
          SERVER_NAME="$(node -p "require('./package.json').mcpName")"
          LOCAL_VERSION="${{ steps.version.outputs.local }}"
          SERVER_NAME_ENCODED="$(SERVER_NAME="$SERVER_NAME" node -p "encodeURIComponent(process.env.SERVER_NAME)")"
          LOCAL_VERSION_ENCODED="$(LOCAL_VERSION="$LOCAL_VERSION" node -p "encodeURIComponent(process.env.LOCAL_VERSION)")"
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0.1/servers/$SERVER_NAME_ENCODED/versions/$LOCAL_VERSION_ENCODED"
          if REGISTRY_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$REGISTRY_URL")"; then
            case "$REGISTRY_STATUS" in
              200)
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "MCP registry already has $SERVER_NAME@$LOCAL_VERSION — nothing to do."
                ;;
              404)
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "MCP registry does not have $SERVER_NAME@$LOCAL_VERSION — publishing."
                ;;
              *)
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "Registry lookup returned HTTP $REGISTRY_STATUS — will attempt the publish and let it decide."
                ;;
            esac
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Registry lookup failed — will attempt the publish and let it decide."
          fi

      - name: Publish to the MCP registry
        if: (steps.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.registry.outputs.changed == 'true'
        # Pinned: an unpinned /latest/ URL silently changes the CLI under CI.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Gated on "the release is missing", never on "npm published in this run": a
      # catch-up dispatch after an npm-lag failure must still finish the release.
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          # Only "release not found" means missing; any other gh failure stops the run
          # rather than racing a create against a release that may already exist.
          if VIEW="$(gh release view "v$VERSION" 2>&1)"; then
            echo "Release v$VERSION already exists — skipping."
            exit 0
          elif ! printf '%s' "$VIEW" | grep -qi 'release not found'; then
            echo "::error::Could not check for release v$VERSION: $VIEW"
            exit 1
          fi
          # npm serves this version by now: "Wait for npm to serve this version" confirmed
          # it when changed is true, and the version step's own npm check did when
          # changed is false. So this never creates a release for an unpublished version.
          # Target main's own commit that set this version (first parent, so a merge
          # commit counts), not whatever HEAD is when a catch-up runs.
          # Escape every ERE metacharacter in the version (dots, and "+" in build metadata).
          VERSION_RE="$(printf '%s' "$VERSION" | sed 's/[][\\.*^$+?(){}|]/\\&/g')"
          SETS_VERSION="\"version\"[[:space:]]*:[[:space:]]*\"$VERSION_RE\""
          TARGET="$(git log -1 --first-parent --diff-merges=first-parent --no-patch --format=%H -G"$SETS_VERSION" -- package.json)"
          if [ -z "$TARGET" ] || ! git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "::error::Could not find the commit on main that set version $VERSION in package.json."
            exit 1
          fi
          gh release create "v$VERSION" --target "$TARGET" --generate-notes
