name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Block CI on high+ advisories in what ships (prod dependencies), let
      # moderates through. Dev-only findings (test tooling) are reported in the
      # next step but don't block: they never reach the package or the image.
      - name: Audit shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Report only: any non-zero exit from the full audit (advisories found,
      # or npm itself failing, e.g. a registry or network error) becomes a
      # visible warning annotation on the run instead of failing the job or
      # passing silently. shell: bash so `||` and the exit status behave the
      # same on Windows legs as on Linux.
      - name: Audit all dependencies (report only)
        shell: bash
        run: npm audit --audit-level=high || echo "::warning title=Dev-dependency advisories::npm audit found high-severity advisories outside the shipped dependency set (report only; see this step's log)"

  # Stable aggregation gate: branch protection requires only this one check, so
  # editing the test matrix (OS/node) never orphans a required check name again.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test leg did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "one or more test jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
