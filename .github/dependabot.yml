# Maintenance mode: version-update PRs are off (limit 0). Security updates still arrive
# through Dependabot security updates, enabled in repository settings.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Production stays on the selected Node LTS line. Dependabot should refresh
    # the pinned image digest without silently changing the runtime major.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
